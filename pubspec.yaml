name: chamify_app
description: Wamama Wetu — a group savings (chama) management app.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management — Riverpod
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.2

  # Routing
  go_router: ^14.6.3

  # Local storage
  shared_preferences: ^2.3.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network
  http: ^1.3.0

  # Utilities
  intl: ^0.20.3
  currency_text_input_formatter: ^2.1.11
  uuid: ^4.5.0
  crypto: ^3.0.5

  # PDF & Excel
  pdf: ^3.11.0
  printing: ^5.12.0
  excel: ^4.0.5

  # File picker
  file_picker: ^8.0.0
  path_provider: ^2.1.3

  # Sharing
  share_plus: ^9.0.0
  url_launcher: ^6.3.1

  # Connectivity
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  custom_lint: ^0.7.2
  riverpod_lint: ^2.3.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/